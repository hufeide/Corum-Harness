# The corum-desktop bundle patch: the desktop surface over the web profile.
# Applied as the HIGHEST overlay layer when the Electron main boots the `web`
# profile.
#
# Transport stance (0.1.2): the official web transport is RETAINED. The
# renderer no longer rides a custom IPC bridge — it loads the official web
# surface over loopback HTTP directly (`loadURL` of the authenticatedUrl the
# host reports). This overlay therefore only PINS the official rows for the
# desktop: loopback-only bind on an ephemeral port, no default-browser
# handoff, and no URL line (the shell owns the window). The rest of the web
# composition (agent presets, every ui-* row, storage, workspace, session
# projection, the base rows) stays untouched.
#
# A patch replaces the targeted row's whole config; `disabled: true` takes the
# row out of the tree without deleting it, so the web surface remains intact
# for a plain `dsh web` boot that never applies this overlay.

# ── official web transport, pinned for the desktop surface ─────────────────

# node:http server + route registry. The renderer reaches it over loopback on
# an ephemeral port (port 0 → the OS assigns one; the host reads the real port
# back from ctx.webServer.port and reports it to the Electron main).
- id: webserver
  config:
    host: '127.0.0.1'
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# Web glue (dist serving via the webserver fallback seat, web-surface prompt,
# bash variable). The desktop shell owns its window: never open the default
# browser and never print the URL line — the host reports the authenticatedUrl
# to the Electron main over the bridge instead.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# ── rows disabled for the desktop surface ──────────────────────────────────

# The official session-log download: a browser surface — its controller drives
# a GET /api/session.export streamed to the browser download manager (an
# `a[download]` click + a "browser is downloading" modal). The native-save
# flow in @corum/corum-session-archive replaces it — so the row is disabled to
# keep one minimal save action and to stop the stray browser-download dialog.
- id: session-log-download
  disabled: true

# The official Models settings page is forked into @corum/corum-ui-settings-models:
# the fork adds a per-model "image input" switch so a hand-declared
# vision-capable model can declare `input: [text, image]` from the UI (the
# official editor only surfaced contextWindow/maxTokens). Disable the official
# row and mount the fork below so only one Models section registers.
- id: ui-settings-models
  disabled: true

# The official model selector is forked into @corum/corum-ui-model-selection: the
# fork presents a rejected model switch caused by an image-containing session
# (model-unavailable) as a friendly info hint instead of a generic
# "operation failed" error toast.
- id: ui-model-selection
  disabled: true

# The official Plugins settings surface is forked into
# @corum/corum-ui-settings-plugins: the fork removes the official
# SubagentModelSelectionCard (the "let the LLM pick the subagent model" switch)
# — that switch is semantically incompatible with fork #10's model lock
# (config.model is a mechanism-fixed route with no LLM parameter surface), and
# keeping it would mislead users. The fixed-route configuration lives in the
# corum「子 Agent」settings section (corum-subagent namespace). Disable the
# official row and mount the fork below so only one Plugins section registers.
- id: ui-settings-plugins
  disabled: true

# The auto directory picker resolves bind host / SSH / display, then mounts a
# browse or native backend — the browse backend and the auto row itself inject
# webServer. The desktop surface pins the native backend (koffi FFI, no HTTP).
- id: directory-picker
  disabled: true

# API Key 加密落盘（TODO 安全项）：官方 dsh-credentials-local 把凭证明文写入
# `$DSH_HOME/.credentials.yaml`（仅 0600 权限，无加密）。corum 的 fork 包
# @corum/corum-credentials-local 在 durable 边界对 ref 值与 api-key record 的
# key/env 值做 AES-256-GCM 加密（enc:v1: 前缀，存量明文条目双读兼容），主密钥
# 由 Electron main 经 safeStorage 封装后注入（CORUM_CREDENTIALS_MASTER_KEY）。
# 官方行在 base bundle 的 insert 块内——compose 的行覆盖对 insert 行按序追加而
# 非替换（同名服务会 duplicate-registration 失败），故沿用本文件的既有纪律：
# 先禁用官方行，再在下方 insert 段以同 id 挂 fork。下游（llm 适配器 /
# Models 页 / credentials RPC）对服务名 `credentials` 的引用零感知。
- id: credentials
  disabled: true

# 统一事件中心一期（docs/agent-foundation/UNIFIED-EVENT-BUS.md）：官方
# dsh-api-remotes 的转发 allowlist 是编译期硬编码常量、registerRemoteEvents 是
# singleton（重复注册抛错），零改动官方包无法扩展事件名。fork 包
# @corum/corum-api-remotes 整文件照抄官方 165 行转发循环 + 162 行 client
# contribution 挂载，仅给 API_REMOTE_FORWARDED_EVENTS 追加 13 个 corum 事件
# （emit 形态；corum/task/* ×10 + corum/group/* ×2 + corum/terminal/output）。
# 官方行在 base bundle（packages/bundle/web-app/cordis.patch.yml）的 insert 块
# 内（行 id `api-remotes`），先禁用再在下方 insert 段挂 fork（行 id 不同名——
# loader 对同层 id 唯一性检查，见下方 insert 段注释）。cordis 服务名
# `typertGateway`/`remote` 不变，renderer 各 ui-* 插件对 ctx.remote 的消费
# （$mount/$on）零感知。
- id: api-remotes
  disabled: true

# 子 Agent 编排框架（docs/plan/PLAN-subagent-orchestration.md，fork #9 转正）：
# 官方 dsh-subagent seam 的 SubagentStartRequest 无 cwd 字段——worktree 硬隔离
# 需要子会话 header.cwd 可指定（fs 写沙箱边界/shell/{{cwd}} 全跟随）。fork 包
# @corum/corum-subagent 现以**完整服务**取代官方 seam（服务名 `subagents` 不变，
# 同 credentials/api-remotes 的「禁官方行 + insert fork 完整包」纪律）：先禁用
# 官方 subagent 服务行，再在下方 insert 段挂 fork 完整包 + corum-spawn provider。
# 服务名不变 → 官方 provider 行（spawn/fork）与 tool-subagent-control
# （send_message/interrupt/list_agents）对 `subagents` 的 inject 零感知。
- id: subagent
  disabled: true

# ── desktop persona ─────────────────────────────────────────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You are running inside the DeepSeek Harness desktop application.

# ── the desktop rows ────────────────────────────────────────────────────────

- insert:
    # Forked encrypted credentials provider (replaces the disabled official
    # credentials row above). NOTE: the row id must differ — the loader rejects
    # a top-level id that collides with a (even disabled) bundle-inserted row
    # ("duplicate loader entry id"), which is also why the settings-models
    # forks above carry the corum- prefix. The cordis SERVICE name stays
    # `credentials` (the fork's provider class calls super(ctx, 'credentials')
    # exactly like the official one), so llm adapters / the Models page / the
    # credentials RPC surface — all of which inject the service, not the row
    # id — see zero difference.
    - id: corum-credentials
      name: '@corum/corum-credentials-local'

    # Forked Remote BFF assembly (replaces the disabled official api-remotes
    # row above): the official 17 forwarded events plus 13 corum domain events
    # (corum/task/*, corum/group/*, corum/terminal/output). The row id must
    # differ from the official `api-remotes` (same loader uniqueness rule as
    # corum-credentials above); the cordis SERVICE names stay `typertGateway`/
    # `remote`, and the fork's package.json `dsh.client` block is preserved
    # verbatim (inject dsh-api-gateway, platform web, immediately) so the
    # client half mounts the Remote contributions exactly like the official.
    - id: corum-api-remotes
      name: '@corum/corum-api-remotes'

    # Fork #9 完整 seam 服务（取代上方禁用的官方 subagent 行）：
    # 服务名 'subagents' 不变（fork 的 SubagentRuntime super(ctx,'subagents')
    # 与官方一致），官方 provider 行（spawn/fork）与 tool-subagent-control
    # 对 ctx.subagents 的 inject/registerProvider 零感知。这使 fork #9 的
    # childSessionMeta(4 参) cwd 透传 + assertChildCwd 在运行时真正生效
    # （消除 REVIEW 的「SEAM 死代码」硬伤：continuable 路径隔离从此生效）。
    - id: corum-subagent
      name: '@corum/corum-subagent'

    # Fork #9 spawn provider：注册 'corum-spawn' provider 进 fork 的 subagents
    # seam——与官方 spawn/fork provider 并存不冲突。provider 行与完整服务行
    # 分开挂载（与服务注册相同的官方 base bundle 结构）。
    - id: corum-subagent-spawn
      name: '@corum/corum-subagent/spawn'

    # Fork #10 工具包本体不单独挂行——工具实例由 corum preset 的 delegation 组
    # 双实例行（tool-subagent / tool-subagent-research，corum-agent compile.ts
    # 生成，name '@corum/corum-tool-subagent'）按会话挂载；host 侧只需包可
    # 解析（desktop deps 已链）。官方 base 的 tool-subagent 行保留：官方
    # subagent_fork / codex / claude-code 实例与 workflow 只读 fan-out 继续走它。
    # invariant 不挂（官方组合未挂 subagent-invariant，fork 对齐同纪律）。

    # Native-only directory picker (the desktop always sits on the host
    # display); replaces the disabled auto row above. The `-auto` row would
    # have mounted BOTH the host backend and the client surface; pinning the
    # backend directly still needs the surface row, whose client half fills
    # ui-workspace's directory-flow holes (the "Add workspace…" affordance).
    - id: corum-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: corum-directory-picker-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # Forked Models settings page: adds the per-model image-input switch to
    # the pi-ai model editor (replaces the disabled official ui-settings-models
    # row above).
    - id: corum-ui-settings-models
      name: '@corum/corum-ui-settings-models'

    # Forked model selector: friendly info hint for a rejected model switch on
    # an image-containing session (replaces the disabled official
    # ui-model-selection row above).
    - id: corum-ui-model-selection
      name: '@corum/corum-ui-model-selection'

    # Forked Plugins settings surface: removes the official
    # SubagentModelSelectionCard registration (replaces the disabled official
    # ui-settings-plugins row above).
    - id: corum-ui-settings-plugins
      name: '@corum/corum-ui-settings-plugins'

    # The desktop bundle's own host + client halves. The host half
    # (corum-desktop-app, src/index.ts) provides the desktop surface prompt +
    # DSH_CORUM_DESKTOP shell variable; the client half (src/client/index.ts)
    # registers framework surfaces: the notification store + the resident Monaco
    # editor column (with embedded resource-manager sub-pane) into the shell's
    # `corum.editor` slot. Without this entry the ModuleRegistry never discovers
    # the dsh.client declaration and the editor + resource manager never mount.
    - id: corum-desktop-app
      name: 'corum-desktop'
